name: Build PanCloud IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

- name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project PanCloud.xcodeproj \
            -scheme PanCloud \
            -configuration Release \
            -archivePath build/PanCloud.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          mkdir -p build/ipa
          cp -R build/PanCloud.xcarchive/Products/Applications/PanCloud.app build/ipa/Payload
          cd build/ipa
          zip -r PanCloud.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanCloud-IPA
          path: build/ipa/PanCloud.ipa
          retention-days: 30

</content>