name: Build PanCloud IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project PanCloud.xcodeproj \
            -scheme PanCloud \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/PanCloud.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            2>&1 | tail -100

      - name: Package IPA for TrollStore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
          cp -R "$GITHUB_WORKSPACE/build/PanCloud.xcarchive/Products/Applications/PanCloud.app" \
                "$GITHUB_WORKSPACE/build/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/build/ipa"
          zip -r PanCloud.ipa Payload
          ls -lh PanCloud.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PanCloud-TrollStore-IPA
          path: build/ipa/PanCloud.ipa
          retention-days: 30

</content>