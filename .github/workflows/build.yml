name: Build PanCloud IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PanCloud.xcodeproj \
            -scheme PanCloud \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/PanCloud.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            2>&1 | tail -120

      - name: Package IPA for TrollStore
        run: |
          set -eux
          ARCHIVE="$GITHUB_WORKSPACE/build/PanCloud.xcarchive"
          echo "=== archive tree ==="
          find "$ARCHIVE" -maxdepth 3 -name "*.app" -print || true
          APP_PATH="$ARCHIVE/Products/Applications/PanCloud.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "PanCloud.app not found, searching..."
            APP_PATH=$(find "$ARCHIVE" -maxdepth 4 -name "PanCloud.app" -type d | head -1)
          fi
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH" | head
          rm -rf "$GITHUB_WORKSPACE/build/ipa"
          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/ipa/Payload/"
          cd "$GITHUB_WORKSPACE/build/ipa"
          zip -qry PanCloud.ipa Payload
          ls -lh PanCloud.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PanCloud-TrollStore-IPA
          path: build/ipa/PanCloud.ipa
          retention-days: 30
